        const negPrompt = 'bad anatomy, deformed, mutated hands, extra digits, missing digits, distorted, low quality, blurry, cartoon, illustration, extra limbs';
        
        for(let i=0; i<batch; i++) {
            const s = seed ? parseInt(seed) : -1;  // Убрал +i
            try {
                const result = await t2i({
                    prompt: prompt,
                    negativePrompt: negPrompt,
                    width: w,
                    height: h,
                    guidanceScale: guidance,
                    seed: s
                });
                
                // Попробуем разные способы получить картинку
                let imgUrl = null;
                let usedSeed = s;
                
                // Способ 1: dataUrl
                if(result && result.dataUrl) {
                    imgUrl = result.dataUrl;
                } 
                // Способ 2: toString() (это может быть HTML код)
                else if(result) {
                    imgUrl = result.toString();
                }
                
                // Если результат сам по себе строка (base64 или URL)
                if(!imgUrl && typeof result === 'string') {
                    imgUrl = result;
                }
                
                if(result && result.inputs && result.inputs.seed) {
                    usedSeed = result.inputs.seed;
                }
                
                if(imgUrl) {
                    addToGallery(imgUrl, prompt, usedSeed);
                }
            } catch(e) { 
                alert('Error: ' + e.message);
            }
        }
    } catch(e) { 
        alert('Error: ' + e.message);
    }
    finally {
        isGenerating = false;
        btn.disabled = false;
        btn.textContent = 'GENERATE';
    }
}
function addToGallery(imgUrl, prompt, seed) {
    const gallery = document.getElementById('gallery');
    if(gallery.querySelector('.empty-state')) gallery.innerHTML = '';
    const item = document.createElement('div');
    item.className = 'gallery-item';
    const img = document.createElement('img');
    img.src = imgUrl;
    img.onclick = () => openModal(imgUrl, prompt, seed);
    item.appendChild(img);
    gallery.insertBefore(item, gallery.firstChild);
}
function openModal(img, prompt, seed) {
    document.getElementById('modal-img').src = img;
    document.getElementById('modal-prompt').textContent = prompt;
    document.getElementById('modal-info').innerHTML = `<strong>Seed:</strong> ${seed || 'Random'}<br><strong>Model:</strong> FLUX`;
    window.currentPrompt = prompt;
    window.currentSeed = seed;
    document.getElementById('modal').classList.add('active');
}
function closeModal() {
    document.getElementById('modal').classList.remove('active');
}
function copyPrompt() {
    if(window.currentPrompt) {
        navigator.clipboard.writeText(window.currentPrompt).then(() => alert('Copied!'));
    }
}
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.accordion-header').forEach(h => {
        h.addEventListener('click', function() {
            const c = this.nextElementSibling;
            this.classList.toggle('active');
            c.classList.toggle('active');
        });
    });
    updatePrompt();
});
    </script>
