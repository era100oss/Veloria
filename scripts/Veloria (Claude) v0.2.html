<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>VELORIA - Phase 2</title>
	<style>
:root {
		--bg-primary: #0A0A0F;
		--bg-secondary: #1A1A24;
		--text-primary: #E0E0E0;
		--text-secondary: #AAAAAA;
		--accent-purple: #9D4EDD;
		--accent-gold: #FFB347;
		--border-color: #2D2D3D;
	}
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}
		html, body {
			font-family: 'Trebuchet MS', sans-serif;
			background: var(--bg-primary);
			color: var(--text-primary);
			width: 100%;
			height: 100%;
			overflow: hidden;
		}
		.container {
			display: flex;
			width: 100%;
			height: 100%;
			gap: 1px;
			background: var(--border-color);
		}
		.panel {
			overflow-y: auto;
			overflow-x: hidden;
			padding: 12px;
			display: flex;
			flex-direction: column;
			gap: 8px;
		}
		.panel-left {
			flex: 0 0 55%;
			background: var(--bg-primary);
		}
		.panel-right {
			flex: 0 0 45%;
			background: var(--bg-secondary);
			margin: 8px;
			display: flex;
			flex-direction: column;
			min-height: 0;
			box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
		}
		h1 {
			font-family: 'Georgia', serif;
			text-align: center;
			color: var(--accent-gold);
			font-size: 1.3rem;
			margin-bottom: 8px;
			letter-spacing: 2px;
			flex-shrink: 0;
			font-weight: 700;
		}
		.accordion {
			border: 1px solid var(--border-color);
			border-radius: 6px;
			overflow: hidden;
			background: var(--bg-secondary);
			flex-shrink: 0;
			margin-bottom: 4px;
		}
		.accordion-header {
			padding: 8px 10px;
			background: var(--border-color);
			cursor: pointer;
			display: flex;
			justify-content: space-between;
			align-items: center;
			font-size: 0.8rem;
			user-select: none;
			font-weight: 600;
		}
		.accordion-header:hover {
			background: #3D3D4D;
		}
		.accordion-header.active {
			background: var(--accent-purple);
			color: white;
		}
		.accordion-icon {
			transition: transform 0.2s;
			font-size: 0.7rem;
		}
		.accordion-header.active .accordion-icon {
			transform: rotate(180deg);
		}
		.accordion-content {
			max-height: 0;
			overflow: hidden;
			transition: max-height 0.2s ease;
		}
		.accordion-content.active {
			max-height: 3000px;
			padding: 8px;
		}
		label {
			font-family: 'Trebuchet MS', sans-serif;
			display: block;
			font-size: 0.75rem;
			color: var(--text-secondary);
			margin-bottom: 2px;
			font-weight: 600;
		}
		select, input, textarea {
			width: 100%;
			padding: 6px;
			background: var(--bg-primary);
			border: 1px solid var(--border-color);
			color: var(--text-primary);
			border-radius: 4px;
			font-size: 0.75rem;
			font-family: inherit;
			margin-bottom: 4px;
		}
		select:focus, input:focus {
			outline: none;
			border-color: var(--accent-purple);
		}
		input[type="checkbox"] {
			margin-right: 6px;
			transform: scale(1.1);
		}
		input[type="range"] {
			width: 100%;
			cursor: pointer;
			accent-color: var(--accent-gold);
		}
		.checkbox-label {
			display: flex;
			align-items: center;
			cursor: pointer;
			font-size: 0.75rem;
		}
		.gallery {
			flex: 1;
			overflow-y: auto;
			display: flex;
			flex-direction: column;
			gap: 6px;
			min-height: 0;
			padding: 4px;
		}
		.gallery-item {
			border-radius: 6px;
			overflow: hidden;
			border: 2px solid var(--border-color);
			cursor: pointer;
			flex-shrink: 0;
			max-height: 180px;
			position: relative;
		}
		.gallery-item:hover {
			border-color: var(--accent-purple);
		}
		.gallery-item img {
			width: 100%;
			height: 160px;
			object-fit: cover;
			display: block;
		}
		.gallery-btn {
			position: absolute;
			top: 4px;
			right: 4px;
			background: rgba(0,0,0,0.7);
			color: white;
			border: none;
			padding: 4px 8px;
			border-radius: 4px;
			font-size: 0.65rem;
			cursor: pointer;
		}
		.gallery-btn:hover {
			background: rgba(0,0,0,0.9);
		}
		.btn-generate {
			background: linear-gradient(135deg, var(--accent-gold), #CC5500);
			color: white;
			border: none;
			padding: 10px;
			border-radius: 6px;
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			flex-shrink: 0;
			margin-top: 4px;
		}
		.btn-generate:hover:not(:disabled) {
			transform: translateY(-2px);
			box-shadow: 0 6px 15px rgba(255,179,71,0.3);
		}
		.btn-generate:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}
		textarea {
			resize: vertical;
			min-height: 200px;
			font-size: 0.7rem;
		}
		.modal {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0,0,0,0.95);
			z-index: 1000;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 12px;
			overflow-y: auto;
		}
		.modal.active {
			display: flex;
		}
		.modal-content {
			background: var(--bg-secondary);
			border-radius: 8px;
			padding: 12px;
			max-width: 90vw;
			max-height: 85vh;
			overflow-y: auto;
			border: 1px solid var(--border-color);
		}
		.modal-image {
			width: 100%;
			border-radius: 6px;
			margin-bottom: 10px;
		}
		.modal-buttons {
			display: flex;
			gap: 6px;
			margin-top: 10px;
			flex-wrap: wrap;
		}
		button {
			padding: 6px 10px;
			background: var(--accent-purple);
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-size: 0.7rem;
		}
		button:hover {
			background: #B565FF;
		}
		.empty-state {
			text-align: center;
			color: var(--text-secondary);
			padding: 20px 10px;
			font-size: 0.8rem;
		}
		.char-title {
			font-size: 0.75rem;
			color: var(--accent-purple);
			margin: 6px 0;
			font-weight: 600;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="panel panel-left">
			<h1>✨ VELORIA</h1>

			<div class="accordion">
				<div class="accordion-header active">
					<span>🎬 Scene Setup</span><span class="accordion-icon">▲</span>
				</div>
				<div class="accordion-content active">
					<label>Participant Count:</label>
					<select id="count" onchange="updateUI()"><option value="solo">Solo</option><option value="couple">Couple</option></select>
					<label><input type="checkbox" id="fpv" onchange="updateUI()"> First Person View</label>
					<div id="fpv-group" style="display:none;">
						<label>FPV Gender:</label>
						<select id="fpv-gender"><option value="">Unspecified</option><option value="woman">Woman</option><option value="man">Man</option><option value="shemale">Shemale</option></select>
					</div>
					<div id="role-group" style="display:none; margin-top:8px; padding-top:8px; border-top:1px solid var(--border-color);">
						<label>Active / Passive:</label>
						<select id="active-char"><option value="char1">Character 1 (Active)</option><option value="char2">Character 2 (Active)</option></select>
					</div>
				</div>
			</div>

			<div class="accordion">
				<div class="accordion-header active">
					<span>👥 Character 1 - Body</span><span class="accordion-icon">▲</span>
				</div>
				<div class="accordion-content active">
					<select id="gender-1" onchange="updateUI()"><option value="">Gender</option><option value="woman">Woman</option><option value="man">Man</option><option value="shemale">Shemale</option></select>
					<select id="age-1" onchange="updatePrompt()"><option value="">Age</option><option value="18_21">18-21</option><option value="21_27">21-27</option><option value="27_35">27-35</option><option value="35_42">35-42</option><option value="42_plus">42+</option></select>
					<select id="body-1" onchange="updatePrompt()"><option value="">Body Type</option><option value="slim">Slim</option><option value="athletic">Athletic</option><option value="curvy">Curvy</option><option value="thick">Thick</option><option value="petite">Petite</option><option value="voluptuous">Voluptuous</option><option value="muscular">Muscular</option><option value="tall_lean">Tall Lean</option></select>
					<select id="breast-1" onchange="updatePrompt()" style="display:none;"><option value="">Breast Size</option><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option><option value="very_large">Very Large</option></select>
					<select id="penis-1" onchange="updatePrompt()" style="display:none;"><option value="">Penis Size</option><option value="small">Small</option><option value="average">Average</option><option value="large">Large</option><option value="very_large">Very Large</option></select>
					<select id="skin-1" onchange="updatePrompt()"><option value="">Skin</option><option value="smooth">Smooth</option><option value="pale">Pale</option><option value="tan">Tan</option><option value="dark">Dark</option><option value="freckles">Freckles</option></select>
				</div>
			</div>

			<div class="accordion">
				<div class="accordion-header">
					<span>😘 Character 1 - Details</span><span class="accordion-icon">▼</span>
				</div>
				<div class="accordion-content">
					<select id="expression-1" onchange="updatePrompt()"><option value="">Facial Expression</option><option value="pleasure">Pleasure</option><option value="pain">Pain</option><option value="ecstasy">Ecstasy</option><option value="seduction">Seduction</option><option value="surprise">Surprise</option><option value="fear">Fear</option><option value="desire">Desire</option></select>
					<select id="clothing-1" onchange="updatePrompt()"><option value="">Clothing</option><option value="naked">Naked</option><option value="teacher">Teacher</option><option value="police">Police Officer</option><option value="nurse">Nurse</option><option value="maid">Maid</option><option value="heels">High Heels</option><option value="barefoot">Barefoot</option><option value="collar">Collar</option><option value="handcuffs">Handcuffs</option><option value="lingerie">Lingerie</option><option value="stockings">Stockings</option></select>
					<select id="body-details-1" onchange="updatePrompt()"><option value="">Body Details</option><option value="tattoos">Tattoos</option><option value="piercings">Piercings</option><option value="freckles">Freckles</option><option value="body-hair">Body Hair</option><option value="shaved">Shaved</option></select>
				</div>
			</div>

			<div id="char-2-section" style="display:none;">
				<div class="accordion">
					<div class="accordion-header active">
						<span>👥 Character 2 - Body</span><span class="accordion-icon">▲</span>
					</div>
					<div class="accordion-content active">
						<select id="gender-2" onchange="updateUI()"><option value="">Gender</option><option value="woman">Woman</option><option value="man">Man</option><option value="shemale">Shemale</option></select>
						<select id="age-2" onchange="updatePrompt()"><option value="">Age</option><option value="18_21">18-21</option><option value="21_27">21-27</option><option value="27_35">27-35</option><option value="35_42">35-42</option><option value="42_plus">42+</option></select>
						<select id="body-2" onchange="updatePrompt()"><option value="">Body Type</option><option value="slim">Slim</option><option value="athletic">Athletic</option><option value="curvy">Curvy</option><option value="thick">Thick</option><option value="petite">Petite</option><option value="voluptuous">Voluptuous</option><option value="muscular">Muscular</option><option value="tall_lean">Tall Lean</option></select>
						<select id="breast-2" onchange="updatePrompt()" style="display:none;"><option value="">Breast Size</option><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option><option value="very_large">Very Large</option></select>
						<select id="penis-2" onchange="updatePrompt()" style="display:none;"><option value="">Penis Size</option><option value="small">Small</option><option value="average">Average</option><option value="large">Large</option><option value="very_large">Very Large</option></select>
						<select id="skin-2" onchange="updatePrompt()"><option value="">Skin</option><option value="smooth">Smooth</option><option value="pale">Pale</option><option value="tan">Tan</option><option value="dark">Dark</option><option value="freckles">Freckles</option></select>
					</div>
				</div>
				<div class="accordion">
					<div class="accordion-header">
						<span>😘 Character 2 - Details</span><span class="accordion-icon">▼</span>
					</div>
					<div class="accordion-content">
						<select id="expression-2" onchange="updatePrompt()"><option value="">Facial Expression</option><option value="pleasure">Pleasure</option><option value="pain">Pain</option><option value="ecstasy">Ecstasy</option><option value="seduction">Seduction</option><option value="surprise">Surprise</option><option value="fear">Fear</option><option value="desire">Desire</option></select>
						<select id="clothing-2" onchange="updatePrompt()"><option value="">Clothing</option><option value="naked">Naked</option><option value="teacher">Teacher</option><option value="police">Police Officer</option><option value="nurse">Nurse</option><option value="maid">Maid</option><option value="heels">High Heels</option><option value="barefoot">Barefoot</option><option value="collar">Collar</option><option value="handcuffs">Handcuffs</option><option value="lingerie">Lingerie</option><option value="stockings">Stockings</option></select>
						<select id="body-details-2" onchange="updatePrompt()"><option value="">Body Details</option><option value="tattoos">Tattoos</option><option value="piercings">Piercings</option><option value="freckles">Freckles</option><option value="body-hair">Body Hair</option><option value="shaved">Shaved</option></select>
					</div>
				</div>
			</div>

			<div class="accordion">
				<div class="accordion-header active">
					<span>⚡ Actions & Modifiers</span><span class="accordion-icon">▲</span>
				</div>
				<div class="accordion-content active">
					<label>Primary Actions (select multiple):</label>
					<div id="actions-list" style="background:var(--bg-primary); border:1px solid var(--border-color); border-radius:4px; padding:6px; max-height:120px; overflow-y:auto; margin-bottom:8px;"></div>

					<label>Action Modifiers (compatible):</label>
					<div id="modifiers-list" style="background:var(--bg-primary); border:1px solid var(--border-color); border-radius:4px; padding:6px; max-height:120px; overflow-y:auto; margin-bottom:8px;"></div>

					<label>Pose:</label>
					<select id="pose" onchange="updatePrompt()"><option value="">Pose</option><option value="kneeling">Kneeling</option><option value="lying_back">Lying on Back</option><option value="lying_stomach">Lying on Stomach</option><option value="sitting_lap">Sitting on Lap</option><option value="standing">Standing</option><option value="missionary">Missionary</option><option value="doggy">Doggy</option><option value="cowgirl">Cowgirl</option><option value="reverse_cowgirl">Reverse Cowgirl</option><option value="spooning">Spooning</option><option value="bent_over">Bent Over</option></select>

					<label>Location:</label>
					<select id="environment" onchange="updatePrompt()"><option value="">Location</option><option value="bedroom">Bedroom</option><option value="bathroom">Bathroom</option><option value="living_room">Living Room</option><option value="office">Office</option><option value="hotel">Hotel Room</option><option value="kitchen">Kitchen</option><option value="outdoor">City Street</option><option value="beach">Beach</option><option value="pool">Poolside</option></select>
				</div>
			</div>

			<div class="accordion">
				<div class="accordion-header">
					<span>💧 Fluids</span><span class="accordion-icon">▼</span>
				</div>
				<div class="accordion-content">
					<div class="char-title">
						Character 1
					</div>
					<div id="fluids-char1"></div>
					<button onclick="addFluidRow(1)" style="width:100%; margin-top:6px; font-size:0.7rem;">+ Add Fluid</button>
					<div id="char2-fluids" style="display:none; margin-top:8px; padding-top:8px; border-top:1px solid var(--border-color);">
						<div class="char-title">
							Character 2
						</div>
						<div id="fluids-char2"></div>
						<button onclick="addFluidRow(2)" style="width:100%; margin-top:6px; font-size:0.7rem;">+ Add Fluid</button>
					</div>
				</div>
			</div>

			<div class="accordion">
				<div class="accordion-header">
					<span>👣 Feet Details</span><span class="accordion-icon">▼</span>
				</div>
				<div class="accordion-content">
					<select id="feet-posture" onchange="updatePrompt()"><option value="">Posture</option><option value="pointed">Pointed Toes</option><option value="flexed">Flexed Toes</option><option value="arched">Arched</option></select>
					<select id="feet-texture" onchange="updatePrompt()"><option value="">Texture</option><option value="smooth">Smooth</option><option value="clean">Clean</option><option value="natural">Natural</option></select>
					<select id="nails-shape" onchange="updatePrompt()"><option value="">Nail Shape</option><option value="round">Round</option><option value="square">Square</option><option value="almond">Almond</option></select>
					<select id="nails-color" onchange="updatePrompt()"><option value="">Nail Color</option><option value="red">Red</option><option value="black">Black</option><option value="nude">Nude</option><option value="pink">Pink</option><option value="white">White</option></select>
				</div>
			</div>

			<div class="accordion">
				<div class="accordion-header">
					<span>🎨 Style & Camera</span><span class="accordion-icon">▼</span>
				</div>
				<div class="accordion-content">
					<label>Lighting:</label>
					<select id="lighting" onchange="updatePrompt()"><option value="">Select</option><option value="soft">Soft</option><option value="dim">Dim</option><option value="natural">Natural</option><option value="dramatic">Dramatic</option></select>
					<label>Atmosphere:</label>
					<select id="atmosphere" onchange="updatePrompt()"><option value="">Select</option><option value="intimate">Intimate</option><option value="sensual">Sensual</option><option value="playful">Playful</option><option value="passionate">Passionate</option></select>
					<label>Style:</label>
					<select id="style" onchange="updatePrompt()"><option value="photorealistic">Photorealistic</option><option value="realistic">Realistic</option><option value="artistic">Artistic</option><option value="cinematic">Cinematic</option></select>
					<label>Camera Angle:</label>
					<select id="angle" onchange="updatePrompt()"><option value="">Select</option><option value="low">Low Angle</option><option value="high">High Angle</option><option value="eye_level">Eye Level</option></select>
					<label>Focus:</label>
					<select id="focus" onchange="updatePrompt()"><option value="">Select</option><option value="face">Face</option><option value="body">Full Body</option><option value="interaction">Interaction</option></select>
					<label>Camera Effects:</label>
					<select id="cam-effect" onchange="updatePrompt()"><option value="">Select</option><option value="dof">Shallow Depth of Field</option><option value="flare">Lens Flare</option><option value="blur">Motion Blur</option><option value="vignette">Vignette</option><option value="bokeh">Bokeh</option></select>
					<label>Field of View:</label>
					<select id="fov" onchange="updatePrompt()"><option value="">Select</option><option value="narrow">Narrow</option><option value="normal">Normal</option><option value="wide">Wide</option></select>
				</div>
			</div>

			<div class="accordion">
				<div class="accordion-header">
					<span>⚙️ Technical</span><span class="accordion-icon">▼</span>
				</div>
				<div class="accordion-content">
					<label>Resolution:</label>
					<select id="resolution"><option value="768x768">768×768</option><option value="512x768">512×768</option><option value="768x512">768×512</option><option value="512x512">512×512</option></select>
					<label>Guidance Scale: <span id="guidance-val">7</span></label>
					<input type="range" id="guidance" value="7" min="1" max="30" step="1" onchange="updateGuidance()" oninput="updateGuidance()">
					<label>Batch: <span id="batch-val">1</span></label>
					<input type="range" id="batch" value="1" min="1" max="10" step="1" onchange="updateBatch()" oninput="updateBatch()">
					<label>Seed:</label>
					<input type="text" id="seed" placeholder="Random">
				</div>
			</div>

			<div class="accordion">
				<div class="accordion-header">
					<span>📝 Prompt (Advanced)</span><span class="accordion-icon">▼</span>
				</div>
				<div class="accordion-content">
					<label><input type="checkbox" id="advanced" onchange="toggleAdvanced()"> Enable Advanced Editing</label>
					<textarea id="prompt-edit" style="display:none; margin-top:8px;"></textarea>
					<button onclick="resetPrompt()" style="display:none; width:100%; margin-top:6px;" id="reset-btn">↻ Reset to Settings</button>
					<button onclick="improvePrompt()" style="display:none; width:100%; margin-top:6px;" id="improve-btn">🤖 AI Remaster</button>
				</div>
			</div>
		</div>

		<div class="panel panel-right">
			<h1>Gallery</h1>
			<button id="fs-btn" onclick="toggleFullscreenCustom()" style="position:fixed; top:8px; left:8px; width:18px; height:18px; background:rgba(157,78,221,0.15); color:white; border:3px solid var(--accent-purple); border-radius:4px; font-size:0.7rem; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; z-index:100;">⛶</button>
			<div class="gallery" id="gallery">
				<div class="empty-state">
					Ready...
				</div>
			</div>
			<button class="btn-generate" id="gen-btn" onclick="generateImage()">ECSTASY</button>
		</div>
	</div>

	<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
		<div class="modal-content">
			<img id="modal-img" class="modal-image">
			<div style="font-size:0.7rem;">

						text = text.replace('{target}', 'the viewer');
					} else if (count === 'couple') {
						if (activeChar === 'char1') {
							text = text.replace('{target}', 'Character 2');
						} else {
							text = text.replace('{target}', 'Character 1');
						}
					} else {
						text = text.replace('{target}', 'themselves');
					}
					actionTexts.push(text);
				});

				p += actionTexts.join(' while ');
			}

			// 4. Modifiers
			if (selectedModifiers.length > 0) {
				const modTexts = selectedModifiers.map(mod => {
					let text = DATA.actionModifiersMap[mod];
					if (text.includes('{target}')) {
						if (fpv || count === 'solo') {
							text = text.replace('{target}', 'them');
						} else if (count === 'couple') {
							const activeChar = document.getElementById('active-char')?.value || 'char1';
							if (activeChar === 'char1') {
								text = text.replace('{target}', 'Character 2');
							} else {
								text = text.replace('{target}', 'Character 1');
							}
						}
					}
					return text;
				});
				p += ', ' + modTexts.join(', ');
			}

			// 5. Pose
			const pose = document.getElementById('pose')?.value;
			if (pose && DATA.poseMap[pose]) p += `, ${DATA.poseMap[pose]}`;
			p += '. ';

			// 6. Expressions & Fluids
			const expr1 = document.getElementById('expression-1')?.value;
			if (expr1 && DATA.expressionMap[expr1]) p += `${DATA.expressionMap[expr1]}`;

			// Собери все жидкости
			let fluidText = '';
			for (let i = 1; i <= fluidCounter[1]; i++) {
				const fluidType = document.getElementById(`fluid-type-1-${i}`)?.value;
				const fluidPlace = document.getElementById(`fluid-place-1-${i}`)?.value;
				if (fluidType && fluidPlace && DATA.fluidMap[fluidType][fluidPlace]) {
					fluidText += `, ${DATA.fluidMap[fluidType][fluidPlace]}`;
				}
			}
			p += fluidText;
			p += '. ';

			// 7. Clothing & Body Details
			const clothing1 = document.getElementById('clothing-1')?.value;
			if (clothing1 && DATA.clothingMap[clothing1]) p += `${DATA.clothingMap[clothing1]}`;
			const bodyDet1 = document.getElementById('body-details-1')?.value;
			if (bodyDet1 && DATA.bodyDetailsMap[bodyDet1]) p += ` ${DATA.bodyDetailsMap[bodyDet1]}`;
			p += '. ';

			// 8. Feet Details
			const feetP = document.getElementById('feet-posture')?.value;
			const feetT = document.getElementById('feet-texture')?.value;
			const nailsS = document.getElementById('nails-shape')?.value;
			const nailsC = document.getElementById('nails-color')?.value;
			let feetDesc = '';
			if (feetP && DATA.feetMap[feetP]) feetDesc += DATA.feetMap[feetP];
			if (feetT && DATA.feetTextureMap[feetT]) feetDesc += `, ${DATA.feetTextureMap[feetT]}`;
			if (nailsS && DATA.nailsShapeMap[nailsS]) feetDesc += `, ${DATA.nailsShapeMap[nailsS]}`;
			if (nailsC && DATA.nailsColorMap[nailsC]) feetDesc += ` with ${DATA.nailsColorMap[nailsC]}`;
			if (feetDesc) p += `Feet: ${feetDesc}. `;

			// 9. Style & Camera
			const style = document.getElementById('style')?.value || 'photorealistic';
			p += `${DATA.styleMap[style]}`;
			const angle = document.getElementById('angle')?.value;
			if (angle && DATA.angleMap[angle]) p += `, ${DATA.angleMap[angle]}`;
			const focus = document.getElementById('focus')?.value;
			if (focus && DATA.focusMap[focus]) p += `, ${DATA.focusMap[focus]}`;
			const camEff = document.getElementById('cam-effect')?.value;
			if (camEff && DATA.camEffectMap[camEff]) p += `, ${DATA.camEffectMap[camEff]}`;
			const fov = document.getElementById('fov')?.value;
			if (fov && DATA.fovMap[fov]) p += `, ${DATA.fovMap[fov]}`;

			// 10. Quality Suffix
			p += ', aesthetic, masterpiece, highly detailed, realistic anatomy, accurate proportions, 5 fingers, 5 toes, 2 arms, 2 legs.';

			return p;
		}

		function updatePrompt() {
			currentPrompt = buildPrompt();
			const promptEdit = document.getElementById('prompt-edit');
			const advanced = document.getElementById('advanced');
			if (promptEdit && advanced && advanced.checked) {
				promptEdit.value = currentPrompt;
			}
		}

		function toggleAdvanced() {
			const checked = document.getElementById('advanced').checked;
			const promptEdit = document.getElementById('prompt-edit');
			const resetBtn = document.getElementById('reset-btn');
			const improveBtn = document.getElementById('improve-btn');

			promptEdit.style.display = checked ? 'block': 'none';
			resetBtn.style.display = checked ? 'block': 'none';
			improveBtn.style.display = checked ? 'block': 'none';

			if (checked) {
				promptEdit.value = currentPrompt;
			}
		}

		function resetPrompt() {
			const promptEdit = document.getElementById('prompt-edit');
			updatePrompt();
			if (promptEdit) promptEdit.value = currentPrompt;
		}

		async function improvePrompt() {
			const promptEdit = document.getElementById('prompt-edit');
			if (!promptEdit.value) {
				alert('Prompt is empty');
				return;
			}

			const btn = document.getElementById('improve-btn');
			btn.disabled = true;
			btn.textContent = '⏳ AI working...';

			try {
				const result = await ai( {
					instruction: 'Improve and enhance this NSFW image prompt. Make it more detailed, vivid, and descriptive while keeping all the core elements. Add more visual details about body language, expressions, lighting effects, and atmosphere. Keep the same sexual content and actions. Respond ONLY with the improved prompt, nothing else.',
					startWith: promptEdit.value
				});

				if (result && result.generatedText) {
					promptEdit.value = result.generatedText;
					currentPrompt = result.generatedText;
				}
			} catch(e) {
				alert('AI error: ' + e.message);
			} finally {
				btn.disabled = false;
				btn.textContent = '🤖 AI Remaster';
			}
		}

		function toggleFullscreenCustom() {
			const html = document.documentElement;
			if (!document.fullscreenElement) {
				if (html.requestFullscreen) {
					html.requestFullscreen();
				} else if (html.webkitRequestFullscreen) {
					html.webkitRequestFullscreen();
				}
			} else {
				if (document.exitFullscreen) {
					document.exitFullscreen();
				} else if (document.webkitExitFullscreen) {
					document.webkitExitFullscreen();
				}
			}
		}

		async function generateImage() {
			if (isGenerating) return;
			isGenerating = true;
			const btn = document.getElementById('gen-btn');
			btn.disabled = true;
			btn.textContent = '⏳ Generating...';

			try {
				const prompt = document.getElementById('advanced').checked ? document.getElementById('prompt-edit').value: currentPrompt;
				const res = document.getElementById('resolution').value;
				const guidance = parseFloat(document.getElementById('guidance').value);
				const batch = parseInt(document.getElementById('batch').value);
				let seed = document.getElementById('seed').value;
				const negPrompt = 'bad anatomy, deformed, extra limbs, mutated hands, low quality, blurry, distorted';

				for (let i = 0; i < batch; i++) {
					const s = seed ? parseInt(seed): -1;
					try {
						const result = await t2i( {
							prompt: prompt,
							negativePrompt: negPrompt,
							resolution: res,
							guidanceScale: guidance,
							seed: s
						});

						if (result) {
							let imgUrl = result.dataUrl || result.toString();
							let usedSeed = (result.inputs && result.inputs.seed) ? result.inputs.seed: s;
							addToGallery(imgUrl, prompt, usedSeed);
						}
					} catch(e) {
						console.error('t2i error:', e);
					}
				}
			} catch(e) {
				alert('Error: ' + e.message);
			} finally {
				isGenerating = false;
				btn.disabled = false;
				btn.textContent = 'ECSTASY';
			}
		}

		function addToGallery(imgUrl, prompt, seed) {
			const gallery = document.getElementById('gallery');
			if (gallery.querySelector('.empty-state')) gallery.innerHTML = '';
			const item = document.createElement('div');
			item.className = 'gallery-item';
			const img = document.createElement('img');
			img.src = imgUrl;
			img.onclick = () => openModal(imgUrl, prompt, seed);
			const btn = document.createElement('button');
			btn.className = 'gallery-btn';
			btn.textContent = '🔄';
			btn.onclick = (e) => {
				e.stopPropagation();
			};
			item.appendChild(img);
			item.appendChild(btn);
			gallery.insertBefore(item, gallery.firstChild);
			generatedImages.push({
				img: imgUrl, prompt, seed
			});
		}

		function openModal(img, prompt, seed) {
			document.getElementById('modal-img').src = img;
			document.getElementById('modal-prompt').textContent = prompt;
			document.getElementById('modal-info').innerHTML = `<strong>Seed:</strong> ${seed || 'Random'}`;
			window.currentPrompt = prompt;
			window.currentImage = img;
			document.getElementById('modal').classList.add('active');
		}

		function closeModal() {
			document.getElementById('modal').classList.remove('active');
		}

		function copyPrompt() {
			if (window.currentPrompt) {
				navigator.clipboard.writeText(window.currentPrompt).then(() => alert('✓ Copied!'));
			}
		}

		function downloadImg() {
			if (window.currentImage) {
				const a = document.createElement('a');
				a.href = window.currentImage;
				a.download = 'veloria.png';
				a.click();
			}
		}

		document.addEventListener('DOMContentLoaded', function() {
			document.querySelectorAll('.accordion-header').forEach(h => {
				h.addEventListener('click', function() {
					const c = this.nextElementSibling;
					this.classList.toggle('active');
					c.classList.toggle('active');
				});
			});
			initActionsList();
			addFluidRow(1);
			addFluidRow(2);
			updatePrompt();
		});
	</script>
