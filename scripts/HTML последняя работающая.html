        .panel-moments { flex: 0 0 45%; background: var(--bg-secondary); display: flex; flex-direction: column; margin: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); min-height: 0; }

        .accordion { border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; background: var(--bg-secondary); flex-shrink: 0; margin-bottom: 6px; }
        .accordion-header { padding: 8px 10px; background: var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; user-select: none; }
        .accordion-header:hover { background: #3D3D4D; }
        .accordion-header.active { background: var(--accent-purple); color: white; }
        .accordion-icon { transition: transform 0.3s; font-size: 0.75rem; }
        .accordion-header.active .accordion-icon { transform: rotate(180deg); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .accordion-content.active { max-height: 2000px; padding: 10px; }
        .control-group { margin-bottom: 8px; }
        label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 3px; font-weight: 500; }
        select, input, textarea { width: 100%; padding: 6px; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 4px; font-size: 0.8rem; font-family: inherit; }
        select:focus, input:focus { outline: none; border-color: var(--accent-purple); }
        input[type="checkbox"] { margin-right: 6px; transform: scale(1.1); }
        .checkbox-label { display: flex; align-items: center; cursor: pointer; font-size: 0.8rem; }
        .gallery { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
        .gallery-item { border-radius: 6px; overflow: hidden; border: 2px solid var(--border-color); cursor: pointer; background: var(--bg-primary); flex-shrink: 0; max-height: 200px; }
        .gallery-item:hover { border-color: var(--accent-purple); }
        .gallery-item img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .gallery-info { padding: 4px 6px; font-size: 0.65rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-generate { background: linear-gradient(135deg, var(--accent-gold), #CC5500); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
        .btn-generate:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 179, 71, 0.3); }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-secondary); border-radius: 8px; padding: 15px; max-width: 90vw; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border-color); }
        .modal-image { width: 100%; border-radius: 6px; margin-bottom: 12px; }
        .modal-info { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.4; word-break: break-word; }
        .modal-buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        button { padding: 8px 12px; background: var(--accent-purple); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        button:hover { background: #B565FF; }
        .prompt-display { background: var(--bg-primary); border: 1px solid var(--border-color); padding: 8px; border-radius: 4px; font-size: 0.7rem; color: var(--text-secondary); min-height: 40px; max-height: 80px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; line-height: 1.2; }

        @media (max-width: 1024px) { .container { flex-direction: column; } .panel-wishes { flex: 0 0 50%; } .panel-moments { flex: 0 0 50%; margin: 4px; } }
    </style>
</head>

        function addImageToGallery(img, pr, sd, res) {
            const gl = document.getElementById('gallery');
            if (gl.children.length === 1) gl.innerHTML = '';
            const it = document.createElement('div');
            it.className = 'gallery-item';
            const ig = document.createElement('img');
            ig.src = img;
            const inf = document.createElement('div');
            inf.className = 'gallery-info';
            inf.textContent = pr.substring(0, 40) + '...';
            it.appendChild(ig);
            it.appendChild(inf);
            it.addEventListener('click', () => openModal(img, pr, sd, res));
            gl.insertBefore(it, gl.firstChild);
        }

        function openModal(img, pr, sd, res) {
            document.getElementById('modal-image').src = img;
            document.getElementById('modal-prompt').textContent = pr;
            document.getElementById('modal-settings').innerHTML = `<p>Seed: ${sd || 'Random'}</p><p>Res: ${res}</p><p>Model: FLUX</p>`;
            document.getElementById('image-modal').classList.add('active');
            window.currentModalPrompt = pr;

        function closeModal() {
            document.getElementById('image-modal').classList.remove('active');
